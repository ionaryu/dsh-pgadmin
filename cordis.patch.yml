# dsh-pgadmin bundle patch
#
# The profile boots this row after its own bundle layers, so the Host half
# starts the loopback proxy and the browser half registers the right-Sidebar
# page. `name` resolves by package name from the profile's node_modules.
#
# The row carries no config on purpose: the defaults live in `src/index.ts`
# (`autostart: true`, `command: pgadmin4`, upstream `http://127.0.0.1:5050`,
# proxy port `5051`). Override them from the profile's own cordis.patch.yml:
#
#   - id: pgadmin
#     config:
#       autostart: true
#       command: 'C:/path/to/pgadmin4.bat'   # when it is not on PATH
- insert:
    - id: pgadmin
      name: dsh-pgadmin
